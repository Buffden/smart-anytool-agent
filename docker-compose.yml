services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
