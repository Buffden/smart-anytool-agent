80036; stroke-width: 1.5;" x1="375" x2="194.75" y1="150.8906" y2="150.8906"/><polygon fill="#A80036" points="204.75,146.8906,194.75,150.8906,204.75,154.8906,200.75,150.8906" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="182.75" x2="182.75" y1="118.8906" y2="138.8906"/><polygon fill="#A80036" points="178.75,128.8906,182.75,138.8906,186.75,128.8906,182.75,132.8906" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="182.75" x2="182.75" y1="430.7344" y2="472.1333"/><polygon fill="#A80036" points="178.75,462.1333,182.75,472.1333,186.75,462.1333,182.75,466.1333" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="14" x="186.75" y="452.0391">no</text><line style="stroke: #A80036; stroke-width: 1.5;" x1="182.75" x2="182.75" y1="520.0708" y2="540.0708"/><polygon fill="#A80036" points="178.75,530.0708,182.75,540.0708,186.75,530.0708,182.75,534.0708" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[7f896f854d1bbc877233393b1f94abcc]
@startuml self-reflection
title Self-Reflection on Failure

start

:filter_tools(question)\n-> specific category tools;

repeat
  :agent.solve(question, tools);

  if (result is None?) then (no - success)
    :Return answer to user;
    stop
  else (yes - failure)
    :Log warning\n"widening to ALL_TOOLS";
    :tools = ALL_TOOLS;
  endif

repeat while (attempt < max_retries?) is (yes)
-> no;

:Return fallback message\nto user;
stop

@enduml

