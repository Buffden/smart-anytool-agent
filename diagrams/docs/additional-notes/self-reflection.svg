roke: #A80036; stroke-width: 1.5;" x1="409" x2="210.25" y1="150.8906" y2="150.8906"/><polygon fill="#A80036" points="220.25,146.8906,210.25,150.8906,220.25,154.8906,216.25,150.8906" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="198.25" x2="198.25" y1="118.8906" y2="138.8906"/><polygon fill="#A80036" points="194.25,128.8906,198.25,138.8906,202.25,128.8906,198.25,132.8906" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="198.25" x2="198.25" y1="441.0781" y2="486.6768"/><polygon fill="#A80036" points="194.25,476.6768,198.25,486.6768,202.25,476.6768,198.25,480.6768" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="18" x="202.25" y="465.875">no</text><line style="stroke: #A80036; stroke-width: 1.5;" x1="198.25" x2="198.25" y1="539.2705" y2="559.2705"/><polygon fill="#A80036" points="194.25,549.2705,198.25,559.2705,202.25,549.2705,198.25,553.2705" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[0ca56399c32bf57dc5695ba7744b53ea]
@startuml self-reflection
title Self-Reflection on Failure
skinparam defaultFontSize 14

start

:filter_tools(question)\n-> specific category tools;

repeat
  :agent.solve(question, tools);

  if (result is None?) then (no - success)
    :Return answer to user;
    stop
  else (yes - failure)
    :Log warning\n"widening to ALL_TOOLS";
    :tools = ALL_TOOLS;
  endif

repeat while (attempt < max_retries?) is (yes)
-> no;

:Return fallback message\nto user;
stop

@enduml

