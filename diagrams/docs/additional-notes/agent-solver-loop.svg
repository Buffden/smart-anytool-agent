phs" textLength="18" x="230.5" y="594.7656">no</text><line style="stroke: #A80036; stroke-width: 1.5;" x1="226.5" x2="226.5" y1="668.1611" y2="688.1611"/><polygon fill="#A80036" points="222.5,678.1611,226.5,688.1611,230.5,678.1611,226.5,682.1611" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[2802087e434491f1361ab95f38822be0]
@startuml agent-solver-loop
title Agent Solver Loop
skinparam defaultFontSize 14

start

:Build messages\n[user question];

repeat
  :Call LLM\n(messages + tools);
  :Read response;

  if (tool_calls present?) then (no)
    :Return response.content;
    stop
  else (yes)
    :Append assistant message\nwith tool_calls to messages;
    :dispatch(tool_name, raw_args);
    :Append tool result to messages;
  endif

repeat while (iteration < max_iterations?) is (yes)
-> no;

:Return None\n(failure signal);
stop

@enduml

