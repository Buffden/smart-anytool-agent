font-size="11" lengthAdjust="spacingAndGlyphs" textLength="14" x="212.75" y="573.9453">no</text><line style="stroke: #A80036; stroke-width: 1.5;" x1="208.75" x2="208.75" y1="641.9771" y2="661.9771"/><polygon fill="#A80036" points="204.75,651.9771,208.75,661.9771,212.75,651.9771,208.75,655.9771" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[5b55e04c520da5ff44a67dfc7b0f3cc6]
@startuml agent-solver-loop
title Agent Solver Loop

start

:Build messages\n[user question];

repeat
  :Call LLM\n(messages + tools);
  :Read response;

  if (tool_calls present?) then (no)
    :Return response.content;
    stop
  else (yes)
    :Append assistant message\nwith tool_calls to messages;
    :dispatch(tool_name, raw_args);
    :Append tool result to messages;
  endif

repeat while (iteration < max_iterations?) is (yes)
-> no;

:Return None\n(failure signal);
stop

@enduml

